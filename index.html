<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile Detail Finder</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://libtl.com">
<link rel="dns-prefetch" href="https://libtl.com">
<!-- Monetag TMA SDK (zone 11963075) — async taaki page pehle khule, ad baad me -->
<script async src='//libtl.com/sdk.js' data-zone='11963075' data-sdk='show_11963075'></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #777777);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);padding:16px;max-width:480px;margin:0 auto}
  h1{font-size:20px;text-align:center;margin:8px 0 4px}
  p.sub{text-align:center;color:var(--hint);font-size:13px;margin-bottom:16px}
  input{width:100%;font-size:22px;letter-spacing:3px;text-align:center;padding:14px;border:2px solid var(--btn);border-radius:12px;background:var(--bg);color:var(--text);outline:none}
  button.main{width:100%;margin-top:12px;padding:14px;font-size:17px;font-weight:700;border:none;border-radius:12px;background:var(--btn);color:var(--btn-text);cursor:pointer}
  button.ghost{width:100%;margin-top:8px;padding:10px;font-size:14px;border:1px solid var(--hint);border-radius:12px;background:transparent;color:var(--text);cursor:pointer}
  #result{margin-top:16px;background:var(--card);border-radius:12px;padding:16px;display:none}
  #result.show{display:block}
  #result .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.25);font-size:15px}
  #result .row:last-child{border:none}
  #result .k{color:var(--hint)}
  #result .v{font-weight:700;text-align:right}
  #error{color:#e5484d;text-align:center;margin-top:10px;font-size:14px;display:none}
  .note{margin-top:14px;font-size:12px;color:var(--hint);text-align:center}
  h2{font-size:15px;margin:18px 0 8px;color:var(--hint)}
  #history .item{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;display:flex;justify-content:space-between}
  /* === MONETAG AD SLOT (apna SmartLink lagao) === */
  .ad-slot{margin-top:16px;text-align:center}
  .ad-slot a{display:inline-block;padding:12px 20px;border-radius:12px;background:var(--btn);color:var(--btn-text);text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <h1>📱 Mobile Detail Finder</h1>
  <p class="sub">Find operator + circle (series based)</p>

  <input id="num" inputmode="numeric" maxlength="10" placeholder="10-digit number">
  <button class="main" onclick="openOffer()">Search 1</button>
  <button class="main" style="background:#2ea043" onclick="lookup()">Search 2</button>
  <div id="error"></div>

  <div id="result">
    <div class="row"><span class="k">Number</span><span class="v" id="r-num"></span></div>
    <div class="row"><span class="k">Operator (original)</span><span class="v" id="r-op"></span></div>
    <div class="row"><span class="k">Circle / State</span><span class="v" id="r-circle"></span></div>
    <div class="row"><span class="k">Series</span><span class="v" id="r-series"></span></div>
  </div>

  <!-- ★ MONETAG: paste your SmartLink URL here ★ -->
  <div class="ad-slot" id="adSlot" style="display:none">
    <a id="offerLink" href="#" target="_blank">⚡ View Best Recharge Offers</a>
  </div>

  <button class="ghost" id="shareBtn" style="display:none" onclick="share()">↗ Share on Telegram</button>

  <p class="note">⚠️ Series reveals only the <b>original</b> operator.<br>It may change after MNP (porting).<br>We never show names/addresses — privacy first.</p>

  <h2>Recent checks</h2>
  <div id="history"></div>

<script src="series.js"></script>
<script>
  // ★ MONETAG SmartLink (Search 1 button ye link kholta hai)
  const SMARTLINK_URL = "https://omg10.com/4/11040910";

  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  if (SMARTLINK_URL) {
    document.getElementById("offerLink").href = SMARTLINK_URL;
    document.getElementById("adSlot").style.display = "block";
  }
  // MultiTag (Popunder/IPP/Vignette/Push): copy the tag from your Monetag
  // dashboard and paste it into <head> — guide: help.monetag.com collection 11021564

  function showError(msg){
    const e = document.getElementById("error");
    e.textContent = msg; e.style.display = "block";
    document.getElementById("result").classList.remove("show");
    document.getElementById("shareBtn").style.display = "none";
  }

  // Search 1 → Rewarded Popup ad first, then Monetag offer link (double earning, one click)
  function openOffer(){
    const go = () => { if (tg?.openLink) tg.openLink(SMARTLINK_URL); else window.open(SMARTLINK_URL, "_blank"); };
    try {
      if (typeof show_11963075 === "function") show_11963075("pop").then(go).catch(go);
      else go();
    } catch(e){ go(); }
  }

  // In-App Interstitial: app khulte hi auto (earning first) — SDK async hai isliye page block nahi hoga
  try {
    if (typeof show_11963075 === "function") show_11963075({ type: "inApp", inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 5, everyPage: false } });
    else window.addEventListener("load", () => { try { show_11963075({ type: "inApp", inAppSettings: { frequency: 2, capping: 0.1, interval: 30, timeout: 5, everyPage: false } }); } catch(e){} });
  } catch(e){}

  let lastNum = "";
  function lookup(){
    const num = document.getElementById("num").value.replace(/\D/g,"");
    document.getElementById("error").style.display = "none";
    if (!/^[6-9]\d{9}$/.test(num)) return showError("Enter a valid 10-digit Indian mobile number (starting 6-9).");
    const series = num.slice(0,4);
    const info = MOBILE_SERIES[series];
    if (!info) return showError("This series is not in our sample data yet. Full database coming soon.");
    lastNum = num;
    document.getElementById("r-num").textContent = "+91 " + num;
    document.getElementById("r-op").textContent = info.op + " *";
    document.getElementById("r-circle").textContent = info.circle;
    document.getElementById("r-series").textContent = series + "xxxxx";
    document.getElementById("result").classList.add("show");
    document.getElementById("shareBtn").style.display = "block";
    saveHistory(num, info);
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  }

  function saveHistory(num, info){
    try{
      const h = JSON.parse(localStorage.getItem("mdf_hist") || "[]");
      h.unshift({n:num, op:info.op, c:info.circle, t:Date.now()});
      localStorage.setItem("mdf_hist", JSON.stringify(h.slice(0,10)));
      renderHistory();
    }catch(e){}
  }
  function renderHistory(){
    const box = document.getElementById("history");
    let h = [];
    try{ h = JSON.parse(localStorage.getItem("mdf_hist") || "[]"); }catch(e){}
    box.innerHTML = h.length
      ? h.map(x => `<div class="item"><span><b>+91 ${x.n}</b></span><span>${x.op} · ${x.c}</span></div>`).join("")
      : `<p class="note">No checks yet.</p>`;
  }
  function share(){
    const text = `I just checked my number's details: ${document.getElementById("r-op").textContent} ${document.getElementById("r-circle").textContent} — check yours too!`;
    const url = "https://t.me/share/url?url=&text=" + encodeURIComponent(text);
    if (tg?.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
  }
  document.getElementById("num").addEventListener("keydown", e => { if (e.key === "Enter") lookup(); });
  renderHistory();
</script>
</body>
</html>
